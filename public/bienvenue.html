<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bienvenue — Cinéma en plein air d'Opio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,ital@9..144,300..700,0..1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --c-bg:#FBF7EF; --c-surface:#FFFFFF; --c-gold:#C98A2B; --c-lavender:#7d6fa0;
    --c-ivory:#241A38; --c-muted:#6a5f80;
    --font-display:'Fraunces','Georgia',serif; --font-body:'Outfit','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--c-bg); color:var(--c-ivory); font-family:var(--font-body);
    min-height:100vh; overflow:hidden; position:relative;
    background-image:
      radial-gradient(circle at 18% 18%, rgba(155,134,201,.14), transparent 42%),
      radial-gradient(circle at 82% 82%, rgba(201,138,43,.13), transparent 45%);
  }
  /* étoiles dorées (visibles sur fond clair) */
  .stars{position:fixed;inset:0;z-index:0;overflow:hidden;}
  .star{position:absolute;background:#C98A2B;border-radius:50%;opacity:.5;animation:tw 3.5s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.8);}50%{opacity:.9;transform:scale(1.2);}}

  .stage{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:5vh 5vw;gap:2.5vh;}

  .eyebrow{letter-spacing:.42em;text-transform:uppercase;font-size:clamp(.8rem,1.6vw,1.1rem);
    color:var(--c-gold);font-weight:600;animation:rise 1s ease both;}
  h1{font-family:var(--font-display);font-style:italic;font-weight:600;
    font-size:clamp(4rem,17vw,13rem);line-height:.95;letter-spacing:-.01em;
    color:var(--c-ivory);text-shadow:0 4px 30px rgba(201,138,43,.18);animation:rise 1.1s .1s ease both;}
  .tonight{animation:rise 1.1s .25s ease both;}
  .tonight .tag{display:inline-block;background:var(--c-gold);color:#231A12;font-weight:700;
    padding:6px 16px;border-radius:999px;font-size:clamp(.8rem,1.6vw,1.05rem);letter-spacing:.05em;margin-bottom:14px;}
  .tonight .film{font-family:var(--font-display);font-size:clamp(1.6rem,4.5vw,3rem);font-weight:500;}
  .tonight .sub{color:var(--c-muted);font-size:clamp(1rem,2vw,1.3rem);margin-top:6px;}

  /* bloc prochainement */
  .next{position:fixed;z-index:1;right:4vw;bottom:4vh;display:flex;align-items:center;gap:20px;
    background:rgba(255,255,255,.9);border:2px solid var(--c-gold);border-radius:22px;
    padding:18px 24px 18px 18px;backdrop-filter:blur(10px);max-width:min(92vw,460px);
    animation:rise 1.2s .5s ease both;box-shadow:0 20px 55px rgba(36,26,56,.16);}
  .next img{width:96px;border-radius:12px;flex:none;box-shadow:0 8px 22px rgba(36,26,56,.28);}
  .next .lbl{letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;color:var(--c-gold);font-weight:600;margin-bottom:6px;}
  .next .t{font-family:var(--font-display);font-weight:600;font-size:1.15rem;line-height:1.15;}
  .next .d{color:var(--c-lavender);font-size:.92rem;margin:6px 0 2px;}
  .next .r{color:var(--c-muted);font-size:.82rem;}

  @keyframes rise{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}

  .fsbtn{position:fixed;z-index:2;left:4vw;bottom:4vh;background:rgba(255,255,255,.9);
    border:1px solid var(--c-gold);color:var(--c-ivory);font-family:var(--font-body);
    font-size:.95rem;padding:12px 20px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);}
  .fsbtn:hover{border-color:var(--c-gold);color:var(--c-gold);}

  @media (max-width:720px){
    .next{position:static;margin:0 auto;right:auto;bottom:auto;}
    .stage{gap:3vh;padding-bottom:4vh;}
  }
</style>
</head>

    function goFS(){var e=document.documentElement;var fn=e.requestFullscreen||e.webkitRequestFullscreen;if(fn)fn.call(e);}
    btn.addEventListener('click',goFS);
    function sync(){var on=document.fullscreenElement||document.webkitFullscreenElement;btn.style.display=on?'none':'';}
    document.addEventListener('fullscreenchange',sync);
    document.addEventListener('webkitfullscreenchange',sync);
  })();
</script>
</body>
</html>
