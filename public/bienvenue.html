<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bienvenue — Cinéma en plein air d'Opio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,ital@9..144,300..700,0..1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --c-bg:#FBF7EF; --c-gold:#C98A2B; --c-lavender:#7d6fa0;
    --c-ivory:#241A38; --c-muted:#6a5f80;
    --font-display:'Fraunces','Georgia',serif; --font-body:'Outfit','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--c-bg);color:var(--c-ivory);font-family:var(--font-body);
    min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;}

  .slide{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;
    background:var(--c-bg);display:flex;flex-direction:column;
    background-image:
      radial-gradient(circle at 16% 16%, rgba(155,134,201,.14), transparent 42%),
      radial-gradient(circle at 84% 20%, rgba(201,138,43,.14), transparent 45%);}

  .stars{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .star{position:absolute;background:var(--c-gold);border-radius:50%;opacity:.5;animation:tw 3.5s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.8);}50%{opacity:.85;transform:scale(1.2);}}

  .hero{position:relative;z-index:1;flex:1 1 auto;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:1.8vh;padding:2vh 5vh 0;}
  .eyebrow{letter-spacing:.42em;text-transform:uppercase;font-size:2.4vh;color:var(--c-gold);
    font-weight:600;animation:rise 1s ease both;}
  h1{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:21vh;line-height:.9;
    letter-spacing:-.01em;color:var(--c-ivory);text-shadow:0 .5vh 4vh rgba(201,138,43,.18);
    animation:rise 1.1s .1s ease both;}
  .tonight{animation:rise 1.1s .25s ease both;}
  .tonight .tag{display:inline-block;background:var(--c-gold);color:#fff;font-weight:700;
    padding:.7vh 2.4vh;border-radius:999px;font-size:2.4vh;letter-spacing:.05em;margin-bottom:1.4vh;}
  .tonight .film{font-family:var(--font-display);font-size:5.2vh;font-weight:500;}
  .tonight .sub{color:var(--c-muted);font-size:2.3vh;margin-top:.8vh;}

  .next{position:relative;z-index:1;flex:0 0 auto;margin:0 5vh 4.5vh;padding:3vh 4vh;
    display:flex;align-items:center;gap:4vh;background:#fff;border:.35vh solid var(--c-gold);
    border-radius:2.6vh;box-shadow:0 2vh 5vh rgba(36,26,56,.14);animation:rise 1.2s .5s ease both;}
  .next.center{justify-content:center;text-align:center;}
  .next img{height:30vh;width:auto;border-radius:1.6vh;flex:none;box-shadow:0 1.2vh 3vh rgba(36,26,56,.3);}
  .next .lbl{letter-spacing:.3em;text-transform:uppercase;font-size:2.2vh;color:var(--c-gold);font-weight:700;margin-bottom:1vh;}
  .next .t{font-family:var(--font-display);font-weight:600;font-size:6vh;line-height:1.02;}
  .next .d{color:var(--c-lavender);font-weight:600;font-size:3.4vh;margin:1.4vh 0 .6vh;}
  .next .r{color:var(--c-muted);font-size:2.4vh;}
  .next.fallback .t{font-size:4.4vh;}

  @keyframes rise{from{opacity:0;transform:translateY(2.4vh);}to{opacity:1;transform:none;}}

  .fsbtn{position:fixed;z-index:3;left:2vh;bottom:2vh;background:rgba(255,255,255,.92);
    border:1px solid var(--c-gold);color:var(--c-ivory);font-family:var(--font-body);
    font-size:1.9vh;padding:1.2vh 2.2vh;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);}
  .fsbtn:hover{border-color:var(--c-gold);color:var(--c-gold);}
  .backbtn{position:fixed;z-index:4;left:2vh;top:2vh;background:rgba(255,255,255,.92);
    border:1px solid var(--c-gold);color:var(--c-ivory);text-decoration:none;font-family:var(--font-body);
    font-size:1.8vh;padding:1vh 2vh;border-radius:999px;opacity:0;transition:opacity .25s ease;}
  .backbtn:hover{opacity:1;}

  @media (max-aspect-ratio:1/1){ .next{flex-direction:column;text-align:center;gap:2vh;} }
</style>
</head>
<body>
  <div class="slide">
    <div class="stars" id="stars" aria-hidden="true"></div>

    <div class="hero">
      <p class="eyebrow">Cinéma en plein air · Opio</p>
      <h1>Bienvenue</h1>
      <div class="tonight" id="tonight" style="visibility:hidden;">
        <span class="tag" id="tonight-tag">Ce soir</span>
        <div class="film" id="tonight-film"></div>
        <div class="sub" id="tonight-sub">Installez-vous — la séance va bientôt commencer 🌟</div>
      </div>
    </div>

    <aside class="next" id="next" style="display:none;"></aside>
  </div>

  <a href="index.html" class="backbtn">← Accueil</a>
  <button id="fsbtn" class="fsbtn">⛶ Plein écran</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  var firebaseConfig = {
    apiKey: "AIzaSyBB-WiFkZfrHQD9rXDQ6KjbeNQyMlO4VbA",
    authDomain: "cinema-en-pleine-air-opi-ac81e.firebaseapp.com",
    projectId: "cinema-en-pleine-air-opi-ac81e",
    storageBucket: "cinema-en-pleine-air-opi-ac81e.firebasestorage.app",
    messagingSenderId: "245777069404",
    appId: "1:245777069404:web:8478506b55ec08fb8abd99"
  };
  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);

  var el = function (id) { return document.getElementById(id); };
  function esc(s) { var t = document.createElement('div'); t.textContent = s == null ? '' : String(s); return t.innerHTML; }
  function parisDay(d) { return d.toLocaleDateString('en-CA', { timeZone: 'Europe/Paris' }); }

  getDocs(collection(db, 'events')).then(function (snap) {
    var now = Date.now();
    var today = parisDay(new Date());
    var events = [];
    snap.forEach(function (d) { events.push(d.data()); });

    // Séance du jour (pour le "Ce soir")
    var duJour = null;
    events.forEach(function (e) {
      if (e.dateISO && parisDay(e.dateISO.toDate()) === today) duJour = e;
    });
    if (duJour) {
      el('tonight-film').textContent = '« ' + duJour.filmTitre + ' »';
      el('tonight').style.visibility = 'visible';
    } else {
      el('tonight-tag').style.display = 'none';
      el('tonight-film').textContent = '';
      el('tonight-sub').textContent = 'Heureux de vous accueillir sous les étoiles d’Opio 🌟';
      el('tonight').style.visibility = 'visible';
    }

    // Prochaine séance à venir (ouverte)
    var avenir = events.filter(function (e) {
      return e.ouvertResa === true && e.dateISO && e.dateISO.toMillis() > now;
    }).sort(function (a, b) { return a.dateISO.toMillis() - b.dateISO.toMillis(); });

    var next = el('next');
    if (avenir.length) {
      var e = avenir[0];
      next.className = 'next';
      next.innerHTML =
        '<img src="/' + esc(e.afficheImg) + '" alt="' + esc(e.filmTitre) + '" onerror="this.style.display=\'none\'">' +
        '<div><div class="lbl">Prochaine séance</div>' +
        '<div class="t">' + esc(e.filmTitre) + '</div>' +
        '<div class="d">🗓️ ' + esc(e.dateLabel) + '</div>' +
        '<div class="r">Réservez sur cinema-en-pleine-air-opio.oria-events.fr</div></div>';
      next.style.display = 'flex';
    } else {
      // Repli : aucune séance programmée
      next.className = 'next center fallback';
      next.innerHTML =
        '<div><div class="lbl">À bientôt</div>' +
        '<div class="t"><span style="color:#C98A2B;">✦</span> De nouvelles séances arrivent bientôt</div>' +
        '<div class="r" style="margin-top:1.2vh;">Programme et réservations sur cinema-en-pleine-air-opio.oria-events.fr</div></div>';
      next.style.display = 'flex';
    }
  }).catch(function () {
    el('tonight-tag').style.display = 'none';
    el('tonight-sub').textContent = 'Heureux de vous accueillir sous les étoiles d’Opio 🌟';
    el('tonight').style.visibility = 'visible';
  });

  (function(){
    var box=el('stars');var n=80;var f=document.createDocumentFragment();
    for(var i=0;i<n;i++){var s=document.createElement('div');s.className='star';
      var sz=Math.random()*0.9+0.25;s.style.width=sz+'vh';s.style.height=sz+'vh';
      s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
      s.style.animationDelay=(Math.random()*3.5)+'s';f.appendChild(s);}
    box.appendChild(f);
  })();
  (function(){
    var btn=el('fsbtn');
    function goFS(){var e=document.documentElement;var fn=e.requestFullscreen||e.webkitRequestFullscreen;if(fn)fn.call(e);}
    btn.addEventListener('click',goFS);
    function sync(){var on=document.fullscreenElement||document.webkitFullscreenElement;btn.style.display=on?'none':'';}
    document.addEventListener('fullscreenchange',sync);
    document.addEventListener('webkitfullscreenchange',sync);
  })();
</script>
</body>
</html>
