# Configuration Netlify — déploiement automatique depuis GitHub.
# Le site est statique (HTML/CSS/JS, aucune étape de build).
# Seul le dossier "public/" est publié : les fichiers Firebase (functions/,
# firebase.json, firestore.rules), les specs (docs/) et les tests restent
# dans le dépôt mais ne sont PAS servis publiquement.
[build]
  publish = "public"
  command = ""

# Le site est désormais hébergé sur Firebase Hosting (nouveau domaine
# cinema-en-pleine-air-opio.oria-events.fr). Ce site Netlify n'est conservé
# que pour rediriger les anciens liens déjà diffusés vers la nouvelle adresse.
[[redirects]]
  from = "/*"
  to = "https://cinema-en-pleine-air-opio.oria-events.fr/:splat"
  status = 301
  force = true
